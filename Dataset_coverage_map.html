var map = L.map("map", { preferCanvas: true }).setView([48.8566, 2.3522], 12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap contributors",
  maxZoom: 19
}).addTo(map);

var renderer = L.canvas({ padding: 0.5 });

function makeLayer(points, color) {
  var markers = [];
  for (var i = 0; i < points.length; i++) {
    var p = points[i];
    var m = L.circleMarker([p[0], p[1]], {
      renderer: renderer,
      radius: 10,
      color: color,
      weight: 0,
      fillColor: color,
      fillOpacity: 0.55
    });
    m.bindPopup((p[2]) + " image" + (p[2] > 1 ? "s" : "") + " a ce lieu");
    markers.push(m);
  }
  return L.layerGroup(markers);
}

var gsvLayer = makeLayer(DATA.gsv_cities, "#2a78d6");
var vprLayer = makeLayer(DATA.vpr_dataset, "#008300");
gsvLayer.addTo(map);
vprLayer.addTo(map);

var panel = L.control({ position: "topright" });
panel.onAdd = function () {
  var d = L.DomUtil.create("div", "panel");

    '<label class="legend-row toggle"><input type="checkbox" id="chk-gsv" checked>' +

    '<span class="count">5 016 lieux</span></label>' +
    '<label class="legend-row toggle"><input type="checkbox" id="chk-vpr" checked>' +
    '<span class="swatch" style="background:#008300"></span>VPR Dataset (Mapillary)' +
    '<span class="count">20 003 lieux</span></label>';
  L.DomEvent.disableClickPropagation(d);
  return d;
};
panel.addTo(map);

document.getElementById("chk-gsv").addEventListener("change", function (e) {
  if (e.target.checked) map.addLayer(gsvLayer); else map.removeLayer(gsvLayer);
});
document.getElementById("chk-vpr").addEventListener("change", function (e) {
  if (e.target.checked) map.addLayer(vprLayer); else map.removeLayer(vprLayer);
});
